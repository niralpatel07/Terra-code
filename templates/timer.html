<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            margin: 0;
            box-sizing: border-box;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        h1 { color: #2d3748; margin-top: 0; }
        button {
            padding: 10px 16px;
            font-size: 16px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .modes { display: flex; gap: 8px; margin-bottom: 16px; }
        .modes button { flex: 1; background: #e2e8f0; color: #2d3748; }
        .modes button.on { background: #4f46e5; color: white; }
        #display { 
            font-size: 72px;
            font-weight: bold;
            color: #2d3748;
            margin: 16px 0;
        }
        .controls { display: flex; gap: 8px; justify-content: center; }
        .secondary { background: #e2e8f0; color: #2d3748; }
        input {
            width: 60px;
            box-sizing: border-box;
            padding: 10px;
            font-sixe: 16px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .stat { color: #4a5568; maargin-top: 20px; }
        a { color: #4f46e5; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Focus Timer</h1>

        <div class="modes">
            <button id="m-focus" class="on" onclick="setMode('focus')">Focus</button>
            <button id="m-short" onclick="setMode('short')">Short Break</button>
            <button id="m-long" onclick="setMode('long')">Long Break</button>
        </div>

        <input type="text" id="what" placeholder="What are you working on?" maxlength="60">

        <div id="display">25.00</div>

        <div class="controls">
            <button onclick="start()">Start</button>
            <button class="secondary" onclick="pause()">Pause</button>
            <button class="secondary" onclick="reset()">Reset</button>
        </div>

    <p class="stat" id="stat">Today: {{ sessions_today }} sessions, {{ minutes_today }} min focused</p>
    <a href="/">Back to tasks</a>
</div>

<script>

    const MODES = {
        focus: { label: "Focus", minutes: 25},
        short: { label: "Short break", minutes: 5},
        long: { label: "Long break", minutes: 15},
    };

    let mode = "focus";
    let remaining = MODES[mode].minutes * 60;
    let endTime = null;
    let timerId = null;
    let audioCtx = null;

    const display = document.getElementById("display");
    const stat = document.getElementById("stat");

    function format(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function render() {
        display.textContent = format(remaining);
        document.title = format(remaining) + " - " + MODES[mode].label;
    }

    function tick() {
        remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
        render();
        if (remaining === 0) {
            finish();
        }
    }

    function start() {
        if (timerId) return;
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext) ();
        }
        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }
        endTime = Date.now() + remaining * 1000;
        timerId = setInterval(tick, 250);
    }

    function pause() {
        clearInterval(timerId);
        timerId = null;
    }

    function reset() {
        pause();
        remaining = MODES[mode].minutes * 60;
        render();
    }

    function setMode(newMode) {
        mode = newMode;
        for (const key in MODES) {
            document.getElementById("m-" + key).classList.toggle("on", key === mode);
        }
        reset();
    }

    function beep() {
        try {
            if (audioCtx.state === "suspended") {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0.4;
            osc.frequency.value = 880;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            setTimeout(function () { osc.stop(); }, 800);
        } catch (e) {}
    }

    function logSession(minutes) {
        fetch("/log-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                minutes: minutes,
                label: document.getElementById("what").value,
            }),
        })
        .then(function (r) { return r.json(); })
        .then(function (d) {
            stat.textContent = "Today: " + d.sessions_today + " sessions, " + d.minutes_today + " min focused";
        })
        .catch(function () {
            stat.textContent = "Could not save session";
        });
    }

    function finish() {
        pause();
        beep();
        if (mode === "focus") {
            logSession(MODES.focus.minutes);
            setMode("short");
        } else {
            setMode("focus");
        }
    }
    render();
</script>
</body>
</html>

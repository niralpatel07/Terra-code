<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FocusList</title>
</head>
<body>
    <h1>FocusList</h1>
    <form>
        <input type="text" placeholder="Add a task...">
        <button type="button">Add</button>
    </form>
    <ul>
        {% for task in tasks %}
        <li>{{ task }}</li>
        {% endfor %}
    </ul>
</body>
</html>
